  pain:"选了「不舒服」→ AI帮你定位哪里不舒服",
  food:"选了「饿了」→ AI推荐饮食偏好",
  med:"选了「吃药」→ AI协助用药流程",
  sleep:"选了「想睡觉」→ AI推荐睡前需求",
  turn:"选了「翻身」→ AI推荐翻身方向",
  light:"选了「开灯」→ AI推荐灯光调节",
  tea:"选了「想喝茶」→ AI推荐茶叶偏好",
  radio:"选了「听收音机」→ AI推荐频道",
  headache:"选了「头疼」→ AI推荐缓解方式",
  noodle:"选了「想吃面」→ AI推荐面条类型",
  window:"选了「看窗外」→ AI推荐更多活动",
  tv:"选了「看电视」→ AI推荐操作",
  company:"选了「有人陪」→ AI推荐想见谁"
};

// ===== Dynamic chain: each step's options depend on previous selections =====
function getChainOptions(selTexts) {
  const step = selTexts.length;
  if (step === 0) {
    return [
      {icon:"👤",text:"我",hint:""},
      {icon:"👦",text:"你",hint:"对家属说"},
      {icon:"👉",text:"叫",hint:"叫某人过来"}
    ];
  }
  const last = selTexts[step - 1];
  if (step === 1) {
    if (last === "我") return [
      {icon:"🤔",text:"想",hint:"表达意愿"},
      {icon:"🙅",text:"不想",hint:"拒绝某事"},
      {icon:"😣",text:"不舒服",hint:"身体不适"}
    ];
    if (last === "你") return [
      {icon:"👋",text:"过来",hint:"让家属过来"},
      {icon:"🙏",text:"帮我",hint:"需要帮助"},
      {icon:"👍",text:"真好",hint:"表达感谢"}
    ];
    if (last === "叫") return [
      {icon:"👦",text:"儿子",hint:""},
      {icon:"👧",text:"孙女",hint:""},
      {icon:"👨‍⚕️",text:"医生",hint:""},
      {icon:"👫",text:"老伴",hint:""}
    ];
  }
  if (step === 2) {
    if (last === "想") return [
      {icon:"👀",text:"见",hint:"想见某人"},
      {icon:"🥤",text:"喝",hint:"想喝东西"},
      {icon:"🍚",text:"吃",hint:"想吃东西"},
      {icon:"🚶",text:"去",hint:"想去某处"}
    ];
    if (last === "不想") return [
      {icon:"💊",text:"吃药",hint:"不想吃药"},
      {icon:"🛏️",text:"翻身",hint:"不想翻身"},
      {icon:"😴",text:"睡觉",hint:"不想睡"},
      {icon:"💉",text:"打针",hint:"不想打针"}
    ];
    if (last === "不舒服") return [
      {icon:"🤕",text:"头疼",hint:""},
      {icon:"💔",text:"胸口闷",hint:""},
      {icon:"🦵",text:"腿疼",hint:""},
      {icon:"🤢",text:"恶心",hint:""}
    ];
    if (last === "过来" || last === "帮我") return [
      {icon:"💧",text:"倒杯水",hint:""},
      {icon:"🛏️",text:"扶我一下",hint:""},
      {icon:"🪟",text:"开窗",hint:""},
      {icon:"💡",text:"开灯",hint:""}
    ];
    if (last === "真好" || last === "儿子" || last === "孙女" || last === "医生" || last === "老伴") {
      return null; // sentence is complete
    }
  }
  if (step === 3) {
    if (last === "见") return [
      {icon:"👧",text:"孙女",hint:""},
      {icon:"👦",text:"儿子",hint:""},
      {icon:"👫",text:"老伴",hint:""},
      {icon:"👨‍⚕️",text:"医生",hint:""}
    ];
    if (last === "喝") return [
      {icon:"💧",text:"水",hint:""},
      {icon:"🍵",text:"茶",hint:""},
      {icon:"🥛",text:"牛奶",hint:""},
      {icon:"🧃",text:"果汁",hint:""}
    ];
    if (last === "吃") return [
      {icon:"🍜",text:"面条",hint:""},
      {icon:"🍚",text:"米饭",hint:""},
      {icon:"🥟",text:"饺子",hint:""},
      {icon:"🥚",text:"鸡蛋",hint:""}
    ];
    if (last === "去") return [
      {icon:"🚻",text:"厕所",hint:""},
      {icon:"🛋️",text:"客厅",hint:""},
      {icon:"🏥",text:"医院",hint:""}
    ];
    // 不想 + something / 不舒服 + something → sentence complete
    return null;
  }
  if (step === 4) {
    return [
      {icon:"⏰",text:"现在",hint:""},
      {icon:"📅",text:"周末",hint:""},
      {icon:"☀️",text:"今天",hint:""},
      {icon:"🌙",text:"明天",hint:""}
    ];
  }
  return null; // max depth reached
}

function chainToText(selTexts) {
  if (selTexts.length <= 1) return selTexts.join("");
  // Add comma before the last word if sentence is 5+ words (natural Chinese pause)
  if (selTexts.length >= 5) {
    return selTexts.slice(0, -1).join("") + "，" + selTexts[selTexts.length - 1];
  }
  return selTexts.join("");
}

const clocks={morning:"08:00",noon:"12:00",night:"21:00"};
const timeIcons={morning:"🌅",noon:"☀️",night:"🌙"};
const greetings={
  morning:n=>`早上好，${n}。今天感觉怎么样？`,
  noon:n=>`中午了，${n}。需要点什么？`,
  night:n=>`晚上了，${n}。有什么需要的吗？`
};

let S={user:"A",time:"morning",mode:"quick",messages:[],chainSel:[],result:null,ctxStep:0,lastKey:null,prevText:""};
function userName(){return S.user==="A"?"爷爷":"爷爷B"}

function setUser(u){
  S.user=u;S.ctxStep=0;S.lastKey=null;S.prevText="";
  document.getElementById("btnUserA").className="ctrl-btn"+(u==="A"?" active":"");
  document.getElementById("btnUserB").className="ctrl-btn"+(u==="B"?" active":"");
  render();
}
function setTime(t){
  S.time=t;S.ctxStep=0;S.lastKey=null;S.prevText="";
  ["morning","noon","night"].forEach(k=>{
    document.getElementById("btn"+k.charAt(0).toUpperCase()+k.slice(1)).className="ctrl-btn"+(t===k?" active":"");
  });
  document.getElementById("clock").textContent=clocks[t];
  render();
}
function setMode(m){
  S.mode=m;S.ctxStep=0;S.lastKey=null;S.prevText="";
  if(m==="chain"){S.chainSel=[];S.result=null}
  render();
}
function goBack(){S.ctxStep=0;S.lastKey=null;S.prevText="";render()}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}

function sendQuick(item,key){
  const name=userName();
  const fullText=S.prevText?S.prevText+"，"+item.text:item.text;
  S.messages.unshift({icon:item.icon,text:name+"："+fullText,time:clocks[S.time]});
  showToast("✅ 已发送给家属："+item.text);
  if(S.ctxStep===0&&followUpData[key]){
    S.ctxStep=1;S.lastKey=key;S.prevText=fullText;
  } else {
    S.ctxStep=0;S.lastKey=null;S.prevText="";
  }
  render();renderMessages();
}

function pickChain(idx){
  const opts = getChainOptions(S.chainSel);
  if (!opts) return;
  S.chainSel.push(opts[idx].text);
  const nextOpts = getChainOptions(S.chainSel);
  if (!nextOpts) {
    const s = chainToText(S.chainSel);
    S.result = s;
    S.messages.unshift({icon:"💬",text:userName()+"："+s,time:clocks[S.time]});
    showToast("✅ 已发送："+s);renderMessages();
  }
  render();
}
function resetChain(){S.chainSel=[];S.result=null;render()}

function renderMessages(){
  const el=document.getElementById("bottomBar");
  let h='<div class="msg-title"><div class="msg-dot"></div><span class="msg-label">家属收到的消息</span></div>';
  if(S.messages.length===0){h+='<div class="msg-empty">点击按钮发送消息</div>'}
  else{h+='<div class="msg-list">';S.messages.slice(0,3).forEach(m=>{h+='<div class="msg-item"><span class="mi">'+m.icon+'</span><span class="mt">'+m.text+'</span><span class="mtm">'+m.time+'</span></div>'});h+='</div>'}
  el.innerHTML=h;
}

function render(){
  const c=document.getElementById("appContent");
  const name=userName();
  let aiBadgeHtml,aiBadgeClass="ai-badge",aiIconClass="ai-icon";
  if(S.mode==="quick"&&S.ctxStep>0){
    aiBadgeClass+=" updated";aiIconClass+=" pulse";
    const hint=contextHints[S.lastKey]||"AI正在根据上下文更新推荐";
    aiBadgeHtml=`<div class="${aiBadgeClass}"><div class="${aiIconClass}">AI</div><div class="ai-hint">${hint}</div></div>`;
  } else {
    aiBadgeHtml=`<div class="${aiBadgeClass}"><div class="${aiIconClass}">AI</div><div class="ai-hint">已根据${name}的习惯和当前时间，智能推荐最可能的表达</div></div>`;
  }
  let h=`
    <div class="app-header"><div class="app-title">猜你想说</div><div class="app-subtitle">不用猜了，AI懂他</div></div>
    <div class="greeting-area"><div class="greeting-text">${timeIcons[S.time]} ${greetings[S.time](name)}</div></div>
    <div class="tab-bar">
      <button class="tab-btn ${S.mode==="quick"?"active":""}" onclick="setMode('quick')">⚡ 快捷模式</button>
      <button class="tab-btn ${S.mode==="chain"?"active":""}" onclick="setMode('chain')">🔗 接龙模式</button>
    </div>${aiBadgeHtml}`;

  if(S.mode==="quick"){
    h+='<div class="content-area">';
    if(S.ctxStep>0){
      h+=`<button class="back-btn" onclick="goBack()">← 重新选择</button>`;
      const hint=contextHints[S.lastKey];
      if(hint)h+=`<div class="context-hint"><span class="context-hint-tag">AI推荐</span><span class="context-hint-text">${hint}</span></div>`;
    }
    let opts,dataSource;
    if(S.ctxStep===0){opts=quickData[S.user][S.time];dataSource=`quickData['${S.user}']['${S.time}']`}
    else{opts=followUpData[S.lastKey]||quickData[S.user][S.time];dataSource=followUpData[S.lastKey]?`followUpData['${S.lastKey}']`:`quickData['${S.user}']['${S.time}']`}
    h+='<div class="quick-cards">';
    opts.forEach((item,i)=>{
      const key=item.key||S.lastKey||"";
      const enterCls=S.ctxStep>0?"card-enter":"";
      h+=`<button class="quick-card ${item.cls} ${enterCls}" onclick="sendQuick(${dataSource}[${i}],'${key}')">
        <div class="card-icon-wrap">${item.icon}</div>
        <div class="card-info"><div class="card-title">${item.text}</div><div class="card-desc">${item.hint}</div></div>
      </button>`;
    });
    h+='</div>';
    h+=`<button class="more-btn" onclick="setMode('chain')">以上都不是？试试接龙模式 →</button>`;
    h+='</div>';
  } else {
    // ===== Chain mode =====
    h+='<div class="content-area">';
    const opts = S.result ? null : getChainOptions(S.chainSel);

    if(S.result){
      h+=`<div class="result-screen">
        <div class="result-check">✅</div>
        <div class="result-card"><div class="result-label">已发送给家属</div><div class="result-text">${S.result}</div></div>
        <button class="reset-btn" onclick="resetChain()">再说一句</button>
      </div>`;
    } else {
      // Sentence display
      if(S.chainSel.length>0){
        h+='<div class="sentence-display">';
        S.chainSel.forEach(t=>{h+=`<span class="sentence-word">${t}</span>`});
        h+='</div>';
      } else {
        h+='<div class="sentence-display"><span class="sentence-ph">逐步选词，拼出想说的话</span></div>';
      }

      // Progress dots (dynamic, based on current path)
      const maxSteps = 5;
      h+='<div class="chain-header">';
      for(let i=0;i<S.chainSel.length;i++){
        h+=`<div class="chain-dot done">✓</div>`;
        h+=`<div class="chain-line done"></div>`;
      }
      if(opts){
        h+=`<div class="chain-dot active">${S.chainSel.length+1}</div>`;
      }
      h+='</div>';

      // Current options (context-aware!)
      if(opts){
        h+='<div class="chain-options">';
        opts.forEach((opt,i)=>{
          h+=`<button class="chain-card card-enter" onclick="pickChain(${i})">
            <div class="opt-icon">${opt.icon}</div>
            <div class="opt-text">${opt.text}</div>
            ${opt.hint?`<div style="font-size:11px;color:#999;margin-left:auto">${opt.hint}</div>`:""}
          </button>`;
        });
        h+='</div>';
      }
    }
    h+='</div>';
  }
  c.innerHTML=h;renderMessages();
}
</script>
</body>
